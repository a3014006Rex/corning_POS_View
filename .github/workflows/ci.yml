name: Foundation checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build SourceCode/Api/TC.slnx --configuration Release
      - run: dotnet test SourceCode/Api/TC.slnx --configuration Release --no-build
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SourceCode/Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: SourceCode/Web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
