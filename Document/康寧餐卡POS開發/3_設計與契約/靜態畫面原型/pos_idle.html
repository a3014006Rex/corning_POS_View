<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>用餐刷卡</title>
  <link rel="stylesheet" href="pos.css">
  <script src="pos.js" defer></script>
</head>
<body data-state="idle">
  <main>
    <header>
      <div class="heading"><h1>用餐刷卡</h1><p id="terminal-caption" hidden></p></div>
      <p class="status" id="status" role="status" aria-live="polite">請感應員工卡</p>
    </header>
    <form id="card-form">
      <dl class="details">
        <div class="field"><dt>工號</dt><dd>—</dd></div>
        <div class="field"><dt>姓名</dt><dd>—</dd></div>
        <div class="field"><dt>卡號</dt><dd>—</dd></div>
        <div class="field"><dt>身分別</dt><dd id="identity-type">—</dd></div>
        <div class="field"><dt>時間</dt><dd><time id="swipe-time">—</time></dd></div>
        <div class="field"><dt>餐點資訊</dt><dd id="meal-info">—</dd></div>
      </dl>
      <section class="payment" aria-label="金額確認">
      <label for="amount">金額（元）</label>
      <div class="amount-wrap">
        <span class="currency" aria-hidden="true">NT$</span>
        <input id="amount" name="amount" type="number" inputmode="numeric" min="1" step="1" required value="" aria-label="金額（新臺幣，可調整）" disabled>
      </div>
      <button id="submit" type="submit" disabled>確認送出</button>
      </section>
    </form>
    <footer class="footer">
      <button class="settings-trigger" id="open-settings" type="button" aria-haspopup="dialog"><span aria-hidden="true">⚙</span> 設定</button>
      <p class="footer-message" id="settings-message" role="status"></p>
      <p class="demo">示範畫面 · 未連接實際交易</p>
    </footer>
  </main>
  <dialog id="settings-dialog" aria-labelledby="settings-title">
    <form id="settings-form">
      <h2 id="settings-title">系統設定</h2>
      <label for="lane-name">餐道名稱</label>
      <input id="lane-name" name="laneName" type="text" maxlength="60" autocomplete="off" placeholder="例如：第一餐道">
      <label for="post-code">post代號</label>
      <input id="post-code" name="postCode" type="text" maxlength="60" autocomplete="off" placeholder="例如：POS01">
      <label for="api-url">API URL</label>
      <input id="api-url" name="apiUrl" type="url" autocomplete="off" spellcheck="false" placeholder="https://example.com/api" aria-describedby="settings-note">
      <p id="settings-note">設定儲存於此瀏覽器；API URL 尚未連接實際交易。</p>
      <p id="settings-error" role="alert"></p>
      <div class="dialog-actions">
        <button id="cancel-settings" type="button">取消</button>
        <button type="submit">儲存設定</button>
      </div>
    </form>
  </dialog>
</body>
</html>
